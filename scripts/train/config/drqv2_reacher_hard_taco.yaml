defaults:
  - drqv2
  - override /wm: infonce
  - _self_

# TACO's `reacher_hard` inherits the medium task preset: 3.1M physics frames.
# With action_repeat=2, this is 1.55M agent steps.
env: swm/ReacherDMControl-v0
env_kwargs:
  task: hard
observation:
  frame_stack: 3
max_episode_steps: 500
num_steps: 1550000
batch_size: 1024
updates_per_step: 1
update_frequency: 2
checkpoint_dir: ./runs/drqv2_reacher_hard_taco
checkpoint_frequency: 1550000

agent:
  stddev: 1.0
  nstep: 3

replay:
  # Limit RAM while retaining temporal clips spanning committed segments.
  capacity: 100000
  commit_interval: 1000

auxiliary:
  enabled: true
  wm:
    enabled: true
    weight: 1.0
    horizon: 3
    projection_dim: 192
    hidden_dim: 256
  reward_prediction:
    enabled: true
  curl:
    enabled: true

evaluation:
  frequency: 5000
  episodes: 10

wandb:
  enable: true
  group: taco-reacher-hard
  tags: [reacher-hard, taco-settings]
