defaults:
  - drqv2
  - _self_

num_steps: 120
batch_size: 2
updates_per_step: 1
checkpoint_dir: ./runs/drqv2_smoke
checkpoint_frequency: 120
agent:
  feature_dim: 16
  hidden_dim: 32
  num_expl_steps: 32
observation:
  image_size: 36
replay:
  capacity: 2000
  commit_interval: 64
evaluation:
  frequency: 120
  episodes: 1
