defaults:
  - agent: sac
  - wm: none
  - _self_

hydra:
  job:
    chdir: false

algorithm:
  name: ${agent.name}

observation:
  mode: state
  state_key: null
  image_size: 84
  frame_stack: 1

env: MountainCarContinuous-v0
env_kwargs: {}
seed: 1
device: cuda:0
torch_threads: 1
max_episode_steps: 0
num_steps: 100000
learning_starts: 1000
batch_size: 256
updates_per_step: 1
update_frequency: 1
checkpoint_dir: ./runs/rl_online
checkpoint_frequency: 10000
resume: null
evaluation_only: false

auxiliary:
  enabled: false
  wm: {}
  reward_prediction:
    enabled: false
    weight: 1.0
    horizon: 1
    hidden_dim: 256
    discount: null
  curl:
    enabled: false
    weight: 1.0
    projection_dim: 128

# Optional model-predictive action selection. Latent rollouts are computed by
# the agent and do not count as environment interactions.
mpc:
  enabled: false
  start_steps: 10000
  horizon: 5
  num_samples: 512
  num_elites: 64
  iterations: 6
  num_pi_trajs: 32
  min_std: 0.05
  max_std: 0.5
  temperature: 0.5
  exploration_noise: 1.0
  # Set to 0 to disable the TD-MPC2-style value-prediction objective and
  # terminal bootstrap. A non-zero default keeps MPC's finite-horizon plans
  # bootstrapped with the value of the predicted terminal WM latent.
  value_coef: 0.1
  value_hidden_dim: 256
  value_num_bins: 101
  value_vmin: -10.0
  value_vmax: 10.0
  rho: 0.5

replay:
  capacity: 50000
  commit_interval: 1000

evaluation:
  frequency: 10000
  episodes: 5

logging:
  frequency: 1000

wandb:
  enable: false
  entity: null
  project: stable-worldmodel-rl
  name: null
  group: null
  tags: []
  run_id: null
