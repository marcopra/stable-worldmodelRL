defaults:
  - rl_online
  - override /agent: drqv2
  - override /wm: none
  - _self_

observation:
  mode: pixels

env: MountainCarContinuous-v0
env_kwargs: {}
device: cuda:0
num_steps: 100000
learning_starts: 2000
batch_size: 256
updates_per_step: 1
update_frequency: 1
checkpoint_dir: ./runs/drqv2

replay:
  capacity: 50000
  commit_interval: 1000

evaluation:
  frequency: 10000
  episodes: 5

wandb:
  project: stable-worldmodel-rl
