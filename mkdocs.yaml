site_name: stable-worldmodel

site_url: https://marcopra.github.io/stable-worldmodelRL/
repo_url: https://github.com/marcopra/stable-worldmodelRL
use_directory_urls: true

theme:
  name: shadcn
  show_title: true
  show_stargazers: false
  pygments_style:
    light: shadcn-light
    dark: github-dark
  topbar_sections: false
  katex_options: {}
  show_datetime: false

nav:
  - index.md
  - quick_start.md
  - baselines.md
  - Environments:
      - envs/pusht.md
      - envs/dmc.md
      - envs/ogb.md
      - envs/tworoom.md
      - envs/piecewise.md
      - envs/gymnasium_robotics.md
      - envs/gymnasium_control.md
      - envs/craftax.md
      - envs/ale.md
  - Guides:
      - guides/checkpoints.md
      - guides/online_learning.md
  - Online RL:
      - Representation objectives: rl_representation_learning.md
      - SAC + TACO (state): rl_sac_taco_state.md
      - Reacher Hard benchmark: rl_reacher_hard_benchmark.md
      - Repository audit: rl_repository_audit.md
      - SWE handoff: rl_swe_handoff.md
  - cli.md
  - Tutorial:
      - tutorial/collect_data.md
      - tutorial/training_wm.md
      - tutorial/new_env.md
  - API:
      - api/world.md
      - api/policy.md
      - api/buffer.md
      - api/solver.md
      - api/planning.md
      - api/spaces.md
      - api/dataset.md
      - api/wrapper.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          inventories:
          - https://docs.python.org/3/objects.inv
          paths: [stable_worldmodel]
          options:
            docstring_options:
              ignore_init_summary: true
            docstring_section_style: list
            filters: ["!^_"]
            heading_level: 3
            inherited_members: false
            merge_init_into_class: true
            separate_signature: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_source: false
            signature_crossrefs: true
            summary: true

markdown_extensions:
  shadcn.extensions.iconify:
  codehilite:
  admonition:
  pymdownx.blocks.details:
  pymdownx.tabbed:
  pymdownx.blocks.tab:
    combine_header_slug: true
    separator: ___
  pymdownx.arithmatex:
    generic: true
  pymdownx.blocks.caption:
